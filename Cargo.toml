[package]
name = "slack2buzz"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
description = "Import Slack workspace history into a Buzz community as a signed archive."
repository = "https://github.com/pawelz/slack2buzz"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
dialoguer = { version = "0.11", default-features = false }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
